# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "DabDemo"

include:
  - src/*.yml
  - src/env/*.yml
  - resources/jobs/*.yml
  - resources/pipelines/*.yml
  - resources/schemas/*.yml
  
permissions:
  -group_name: "de_grp"
  level: "CAN_MANAGE"

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-53ff0768-dbd9.cloud.databricks.com


qa:
  default: false
  workspace:
    host: https://dbc-53ff0768-dbd9.cloud.databricks.com



